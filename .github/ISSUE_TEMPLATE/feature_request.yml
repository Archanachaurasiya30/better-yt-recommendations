name: Feature request
description: Suggest a way to make YouTube less distracting.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What distracts you, or what's hard to do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like the extension to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you've tried?
